# Local Postgres 16. An empty volume runs db/docker-init/apply_app_schema.sh:
#   schema.sql, migrations 001–008, sample workbook, AED formatting, tenant seed.
# `npm run demo:seed` adds the four Al Dhabi demo scenarios.
# Usage (Fedora / any host with Docker Compose v2):
#   docker compose up -d db
#   cd server && npm install && npm run demo:seed && npm run dev   # :4000
#   cd web && npm install && npm run dev                          # :5173
# Or: ./scripts/dev-up.sh  (see README “Fedora local run”)
services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: ecc-postgres:16
    container_name: ecc-postgres
    environment:
      POSTGRES_USER: ecc
      POSTGRES_PASSWORD: ecc_dev_password
      POSTGRES_DB: cyber_command_center
      ECC_SQL_ROOT: /ecc-src/db
      ECC_SAMPLE_XLSX: /ecc-src/reference/CyberCommandCenter_Sample_Data.xlsx
    ports:
      - "5433:5432"
    volumes:
      - ecc_pgdata:/var/lib/postgresql/data
      - ./:/ecc-src:ro
      - ./db/docker-init/apply_app_schema.sh:/docker-entrypoint-initdb.d/10_apply_app_schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecc -d cyber_command_center"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  ecc_pgdata:
