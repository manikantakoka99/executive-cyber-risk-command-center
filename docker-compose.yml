# One-command local stack: Postgres 16 + DWAN schema + two demo tenants.
# Usage:
#   docker compose up -d
#   # then start API + web (see README) OR: ./scripts/dev-up.sh
services:
  db:
    image: postgres:16-alpine
    container_name: ecc-postgres
    environment:
      POSTGRES_USER: ecc
      POSTGRES_PASSWORD: ecc_dev_password
      POSTGRES_DB: cyber_command_center
    ports:
      - "5433:5432"
    volumes:
      - ecc_pgdata:/var/lib/postgresql/data
      # Authoritative DWAN consolidated schema (reference data + RLS)
      - ./db/dwan_schema.sql:/docker-entrypoint-initdb.d/01_dwan_schema.sql:ro
      - ./db/docker-init/02_app_compat.sql:/docker-entrypoint-initdb.d/02_app_compat.sql:ro
      - ./db/docker-init/03_seed_tenants.sql:/docker-entrypoint-initdb.d/03_seed_tenants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecc -d cyber_command_center"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  ecc_pgdata:
