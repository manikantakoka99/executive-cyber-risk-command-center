name: clean-install

on:
  pull_request:
  push:
    branches: [master]

jobs:
  clean-install:
    name: empty volume, seed, CISO headline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Clean install
        run: ./scripts/verify-clean-install.sh
