<title>DWAN Command Center Views</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout concept: one workspace, eight views. A sticky header carries the logo, the view tabs and the sample-data tag;
   every view opens with a one-sentence answer, then evidence, then actions. Single dark theme matched to the dwansys logo. */
:root{
  --bg:#04080C; --surface:#0B131A; --surface2:#121D27; --line:#1E2C3A; --grad-a:#37B6E8; --grad-b:#B77CF7;
  --fg:#E8EEF4; --muted:#9DAEBE; --accent:#37B6E8; --accent-ink:#04141C;
  --crit:#F0555C; --high:#F0923E; --med:#E8C547; --low:#3FB966; --good:#3FB966;
  --display:'Sora','Segoe UI',system-ui,sans-serif; --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
.grad{color:var(--grad-b)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.grad{background:linear-gradient(90deg,var(--grad-a),var(--grad-b));-webkit-background-clip:text;background-clip:text;color:transparent}}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;min-height:64px;padding-block:8px}
.logo{height:32px;width:auto;display:block}
.tag{font:500 11px/1 var(--mono);padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sp{flex:1}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
nav.tabs button{background:none;border:1px solid transparent;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted);white-space:nowrap}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
nav.tabs .dot{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:99px;background:var(--crit);color:#fff;font:600 11px/1.5 var(--mono)}

main{padding-block:32px 72px}
.view[hidden]{display:none}
.answer{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.answer .q{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.answer h1{font-size:clamp(24px,3.6vw,38px);font-weight:600}
.answer p{color:var(--muted);max-width:75ch}

/* primitives */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card h3{font-size:16px;font-weight:600;margin-bottom:12px}
.lbl{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font:700 clamp(30px,4vw,44px)/1.05 var(--display);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.c-high{background:color-mix(in srgb,var(--high) 16%,transparent);color:var(--high)}
.c-med{background:color-mix(in srgb,var(--med) 16%,transparent);color:var(--med)}
.c-low{background:color-mix(in srgb,var(--low) 16%,transparent);color:var(--low)}
.c-info{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.c-mute{background:var(--surface2);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}
.rule{height:1px;background:var(--line);margin:14px 0}

/* headline */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.band-big{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.band-big .word{font:700 clamp(44px,7vw,76px)/1 var(--display);letter-spacing:-.02em}
.why{margin-top:14px;padding:12px 14px;border-left:3px solid var(--high);background:color-mix(in srgb,var(--high) 8%,var(--surface));border-radius:0 10px 10px 0;font-size:14px}
.spread{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.range{position:relative;height:34px;margin:14px 0 6px}
.range .rail{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:4px;background:var(--surface2)}
.range .span{position:absolute;top:11px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));opacity:.85}
.range .mk{position:absolute;top:4px;width:2px;height:26px;background:var(--fg)}
.range .t{position:absolute;top:-6px;transform:translateX(-50%);font:500 11px/1 var(--mono);color:var(--muted);white-space:nowrap}

/* domains table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.sbar{position:relative;height:10px;min-width:120px;border-radius:5px;background:var(--surface2)}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.sbar i.hatch{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.35) 0 4px,transparent 4px 8px)}
.sbar b{position:absolute;top:-4px;width:2px;height:18px;background:var(--fg);border-radius:1px}
.k-crit{background:var(--crit)}.k-high{background:var(--high)}.k-med{background:var(--med)}.k-low{background:var(--low)}
.spark{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px}

/* drawer */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);padding:24px;overflow-y:auto;z-index:40;transform:translateX(100%);transition:transform .2s;box-shadow:-30px 0 80px -40px #000}
.drawer.open{transform:none}
.drawer h2{font-size:22px;margin-bottom:4px}
.drawer .x{position:absolute;right:14px;top:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.scrim[hidden]{display:none}

/* queue */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px}
.item h3{font-size:16px;margin-bottom:6px}
.item .meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.item .rec{font-size:14px;margin-top:8px}
.item .rec b{color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.item.done{opacity:.7}
.form{margin-top:12px;padding:14px;border:1px dashed var(--line);border-radius:10px;display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.form textarea{min-height:56px;resize:vertical}

/* what-if */
.sl{display:grid;gap:6px;margin-bottom:14px}
.sl label{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sl label b{font:600 14px/1.5 var(--mono)}
.sl .w{font:500 12px/1.5 var(--mono);color:var(--muted);margin-left:6px}
input[type=range]{width:100%;accent-color:var(--accent);height:26px;background:none}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:10px 18px;font-size:14px;align-items:baseline}
.cmp .h{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cmp .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cmp .d{color:var(--good)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.presets button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* change + pack */
.diff{display:grid;gap:10px}
.diff .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.arrow-up{color:var(--crit)}.arrow-dn{color:var(--good)}.arrow-eq{color:var(--muted)}
.pack{background:#F4F6F8;color:#12202B;border-radius:14px;padding:clamp(22px,4vw,44px);font-family:var(--body);line-height:1.6}
.pack h2{font-size:26px;color:#0B1B26;margin-bottom:6px}
.pack h4{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#2A6F8F;margin:22px 0 8px;font-family:var(--mono)}
.pack p,.pack li{font-size:15px}
.pack ul{padding-left:20px;margin:6px 0}
.pack .src{font:500 11px/1 var(--mono);color:#5A6B78;margin-left:6px;white-space:nowrap}
.pack .meta{font:500 12px/1.5 var(--mono);color:#5A6B78}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);border-radius:12px;padding:12px 18px;font-size:14px;z-index:60;box-shadow:0 20px 60px -20px #000}
.toast[hidden]{display:none}
footer{border-top:1px solid var(--line);padding-block:22px;font-size:12px;color:var(--muted)}

@media (max-width:860px){.tag.t1{display:none}.hero{grid-template-columns:minmax(0,1fr)}.item{grid-template-columns:minmax(0,1fr)}.acts{justify-content:flex-start}.role{display:none}}
@media (max-width:560px){.cmp{grid-template-columns:1fr auto auto;gap:8px 10px}.logo{height:26px}}
@media print{header.top,footer,nav.tabs,.noprint{display:none!important}body{background:#fff}.view[hidden]{display:none}.pack{border-radius:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.drawer{transition:none}}
</style>

function adj(raw,cov){return cov*raw+(1-cov)*Math.max(raw,U)}
function band(s){return s>=70?'Critical':s>=55?'High':s>=35?'Medium':'Low'}
function bcls(b){return {Critical:'crit',High:'high',Medium:'med',Low:'low'}[b]}
function conf(d){return (d.fresh/d.tot)*d.cov}
function confLbl(c){return c>=.8?'High':c>=.5?'Medium':'Low'}
function appState(a,max){return a>max?'Outside appetite':a>max-5?'Approaching':'Within appetite'}
function appCls(s){return s==='Outside appetite'?'c-crit':s==='Approaching'?'c-med':'c-low'}
function f1(x){return (Math.round(x*10)/10).toFixed(1)}
function f2(x){return (Math.round(x*100)/100).toFixed(2)}

function compute(list,rawOverride){
  var rows=list.map(function(d){
    var raw=rawOverride&&rawOverride[d.id]!=null?rawOverride[d.id]:d.raw;
    var a=adj(raw,d.cov);
    return {d:d,raw:raw,adj:a,band:band(a),conf:conf(d)};
  });
  var sw=0,sum=0,counts={Critical:0,High:0,Medium:0,Low:0},cs=0;
  rows.forEach(function(r){sw+=r.d.w;sum+=r.adj*r.d.w;counts[r.band]++;cs+=r.conf*r.d.w});
  var arith=sum/sw, disp=band(arith), floored=false;
  if(counts.Critical>0 && (disp==='Medium'||disp==='Low')){disp=FLOOR_BAND;floored=true}
  return {rows:rows,arith:arith,disp:disp,floored:floored,counts:counts,conf:cs/sw,plain:rows.reduce(function(a,r){return a+r.raw},0)/rows.length};
}

function daysFromNow(n){var d=new Date(Date.UTC(2026,8,5));d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

/* ---------- helpers ---------- */
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function chip(cls,t){return '<span class="chip c-'+cls+'">'+esc(t)+'</span>'}
function bandChip(b){return chip(bcls(b),b)}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){e.hidden=true},2800)}
function spark(a,color,w,h){
  w=w||88;h=h||26;var mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),rg=Math.max(mx-mn,4);
  var pts=a.map(function(v,i){return (i*(w-6)/(a.length-1)+3).toFixed(1)+','+(h-4-((v-mn)/rg)*(h-8)).toFixed(1)}).join(' ');
  var last=pts.split(' ').pop().split(',');
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Six month trend from '+a[0]+' to '+a[a.length-1]+'"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+color+'"/></svg>';
}
function sbar(r){
  var lowc=r.conf<.8;
  return '<div class="sbar" title="Score '+f1(r.adj)+', appetite limit '+r.d.app+'"><i class="k-'+bcls(r.band)+(lowc?' hatch':'')+'" style="width:'+Math.min(100,r.adj)+'%"></i><b style="left:'+r.d.app+'%"></b></div>';
}
function rangeBar(ale,p90,max){
  var mk=ale/max*100,hi=p90/max*100;
  return '<div class="range"><div class="rail"></div><div class="span" style="left:0;width:'+hi+'%"></div><div class="mk" style="left:'+mk+'%"></div><span class="t" style="left:'+mk+'%;top:-8px">expected '+f2(ale)+'M</span><span class="t" style="left:'+Math.min(hi,94)+'%;top:30px">bad year (1 in 10) '+f2(p90)+'M</span></div><div style="height:16px"></div>';
}

}

/* 3 trust */
function rTrust(){
  var B=BASE, stale=0,total=0;D.forEach(function(d){stale+=d.tot-d.fresh;total+=d.tot});
  $('v-trust').innerHTML=
  '<div class="answer"><span class="q">Can I believe the numbers?</span><h1>'+(total-stale)+' of '+total+' feeds are fresh; confidence is '+confLbl(B.conf).toLowerCase()+' at '+Math.round(B.conf*100)+'%.</h1><p>Confidence = fresh feeds ÷ total feeds × coverage. Stale or partial feeds are flagged and lower confidence; they are never counted as good. Assets that no tool sees are assumed to be at least as weak as the policy default ('+U+').</p></div>'+
  '<div class="grid g4" style="margin-bottom:16px">'+
   '<div class="card"><div class="lbl">Feeds fresh</div><div class="big" style="margin-top:8px">'+(total-stale)+'/'+total+'</div></div>'+
   '<div class="card"><div class="lbl">Weighted coverage</div><div class="big" style="margin-top:8px">'+Math.round(D.reduce(function(a,d){return a+d.cov*d.w},0)/D.reduce(function(a,d){return a+d.w},0)*100)+'%</div></div>'+
   '<div class="card"><div class="lbl">Double-counting check</div><div class="big" style="margin-top:8px;color:var(--good)">Pass</div><p class="note" style="margin-top:6px">No signal carries weight in two domains.</p></div>'+
   '<div class="card"><div class="lbl">Policy</div><div class="big" style="margin-top:8px">v1</div><p class="note" style="margin-top:6px">Draft, awaiting CISO sign-off.</p></div>'+
  '</div>'+
  '<div class="tw"><table><thead><tr><th>Domain</th><th class="num">Fresh / total</th><th class="num">Coverage</th><th>Confidence</th><th>Reading</th></tr></thead><tbody>'+
  B.rows.slice().sort(function(a,b){return a.conf-b.conf}).map(function(r){
    var d=r.d, lab=d.fresh<d.tot?(d.tot-d.fresh)+' of '+d.tot+' feeds stale':(d.cov<.8?'Low coverage ('+Math.round(d.cov*100)+'% of assets seen)':'Fresh feeds, good coverage');
    var cc=r.conf>=.8?'low':r.conf>=.5?'med':'crit';
    return '<tr><td><b>'+esc(d.n)+'</b></td><td class="num">'+d.fresh+' / '+d.tot+'</td><td class="num">'+Math.round(d.cov*100)+'%</td><td>'+chip(cc,confLbl(r.conf)+' '+Math.round(r.conf*100)+'%')+'</td><td class="muted">'+esc(lab)+'</td></tr>';
  }).join('')+'</tbody></table></div>'+
  '<p class="note" style="margin-top:12px">Coverage and feed counts are illustrative. In production each row links to its connector runs, rejected-row rate and the asset list behind the denominator.</p>';
}

/* 5 what-if */
function ransomRaw(w){
  return RAN_CATS.reduce(function(a,c,i){var g=[w.edr,w.siem,w.imm,w.dr][i];return a+c.w*g/100},0);
}
function rWhatif(){
  var w=S.whatif, raw=ransomRaw(w), before=BASE.rows.filter(function(r){return r.d.id==='ran'})[0];
  var ov={};ov.ran=raw;var after=compute(D,ov);
  var ranAfter=after.rows.filter(function(r){return r.d.id==='ran'})[0];
  var ratio=ranAfter.adj/before.adj;
  var aleB=LOSS.ran.ale,aleA=aleB*ratio,p90A=LOSS.ran.p90*ratio;
  var entA=ENT.ale-aleB+aleA, red=aleB-aleA;
  var cost=parseFloat(w.cost);
  var changed=(w.edr!==52||w.siem!==30||w.imm!==50||w.dr!==75);
  function sl(id,label,wt){return '<div class="sl"><label for="wi-'+id+'"><span>'+label+'<span class="w">weight '+wt+'</span></span><b id="wv-'+id+'">'+w[id]+'% gap</b></label><input id="wi-'+id+'" type="range" min="0" max="100" value="'+w[id]+'" data-wi="'+id+'"></div>'}
  $('v-whatif').innerHTML=
  '<div class="answer"><span class="q">What should I fund?</span><h1>'+(changed?'Ransomware Readiness moves from '+f1(before.raw)+' to '+f1(raw)+', and expected loss falls by AED '+f2(red)+'M a year.':'Move a slider to see what a control investment would do.')+'</h1><p>Each slider is the remaining gap for a ransomware control category, using the deck’s weights. The engine reuses the production scoring rules; nothing here changes the live score.</p></div>'+
  '<div class="grid g2"><div class="card"><h3>Control gaps</h3>'+
   '<div class="presets" role="group" aria-label="Scenarios"><button class="btn sm" data-preset="now" aria-pressed="'+(!changed)+'">Today</button><button class="btn sm" data-preset="A">A. Immutable backup</button><button class="btn sm" data-preset="B">B. Recovery testing</button><button class="btn sm" data-preset="C">C. Both</button></div>'+
   sl('edr','EDR / XDR',25)+sl('siem','SIEM / SOAR',20)+sl('imm','Immutable backup',25)+sl('dr','DR / recovery testing',30)+
   '<div class="sl"><label for="wi-cost"><span>Estimated cost (AED millions, optional)</span></label><input id="wi-cost" class="mono" style="background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px" type="number" min="0" step="0.1" placeholder="e.g. 0.4" value="'+esc(w.cost)+'"></div>'+
  '</div>'+
  '<div class="card"><h3>Before and after</h3><div class="cmp"><span class="h">Measure</span><span class="h" style="text-align:right">Now</span><span class="h" style="text-align:right">After</span>'+
   row('Ransomware raw score',f1(before.raw),f1(raw))+
   row('Ransomware adjusted score',f1(before.adj),f1(ranAfter.adj))+
   row('Ransomware band',before.band,ranAfter.band)+
   row('Enterprise arithmetic score',f1(BASE.arith),f1(after.arith))+
   row('Enterprise headline',BASE.disp,after.disp)+
   row('Ransomware expected loss (AED M a year)',f2(aleB),f2(aleA))+
   row('Ransomware bad year (AED M)',f2(LOSS.ran.p90),f2(p90A))+
   row('Enterprise expected loss (AED M a year)',f2(ENT.ale),f2(entA))+
  '</div>'+
  (cost>0&&red>0?'<div class="why" style="border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))"><b>'+f2(red/cost)+' AED of expected annual loss avoided per AED spent</b> (at AED '+f2(cost)+'M). Show the bad-year reduction as well, since boards often fund against the tail.</div>':'')+
  (after.floored||BASE.floored?'<p class="note" style="margin-top:12px">The headline stays High while any domain is Critical, so a ransomware investment alone does not change it. That is the floor rule working as designed.</p>':'')+
  '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn primary sm" data-savescen '+((!changed||!canAct())?'disabled':'')+'>Save scenario</button></div>'+
  '<p class="note" style="margin-top:12px">Modelled output. Expected loss scales with the adjusted score: ALE after = ALE before × (score after ÷ score before), exponent 1 (illustrative). Replace with the client’s calibrated loss model.</p></div></div>'+
  (S.scen.length?'<div class="card" style="margin-top:16px"><h3>Saved scenarios</h3><div class="tw"><table><thead><tr><th>Scenario</th><th class="num">Score after</th><th class="num">Loss avoided (AED M)</th><th class="num">Cost (AED M)</th><th></th></tr></thead><tbody>'+S.scen.map(function(s,i){return '<tr><td>'+esc(s.name)+'</td><td class="num">'+s.score+'</td><td class="num">'+s.red+'</td><td class="num">'+esc(s.cost||'n/a')+'</td><td><button class="btn sm" data-todec="'+i+'"'+(canAct()?'':' disabled')+'>Convert to decision</button></td></tr>'}).join('')+'</tbody></table></div></div>':'');
  function row(l,a,b){var dd=(a!==b);return '<span>'+esc(l)+'</span><span class="n">'+esc(a)+'</span><span class="n'+(dd?' d':'')+'">'+esc(b)+'</span>'}
}
var PRESETS={now:{edr:52,siem:30,imm:50,dr:75},A:{edr:52,siem:30,imm:10,dr:75},B:{edr:52,siem:30,imm:50,dr:35},C:{edr:52,siem:30,imm:10,dr:35}};
var PNAME={now:'Today',A:'A. Fund immutable backup',B:'B. Fund recovery testing',C:'C. Both'};

/* 6 closure */
function rClosure(){
  var rep=S.fixes.filter(function(f){return f.state==='fix_reported'}).length;
  var expSoon=S.accept.filter(function(a){return daysTo(a.expires)<=30}).length;
  var dis=!canAct();
  $('v-closure').innerHTML=
  '<div class="answer"><span class="q">Did it work?</span><h1>'+rep+' fix'+(rep===1?'':'es')+' reported but not verified; '+expSoon+' accepted risk'+(expSoon===1?'':'s')+' expiring in 30 days.</h1><p>A fix is closed only when the next scan confirms the weakness is gone. Accepted risks always carry a reason, an approver and an expiry.</p></div>'+
  '<div class="grid g2"><div class="card"><h3>Verified closure</h3>'+
  S.fixes.map(function(f){
    var st=f.state==='verified_closed'?chip('low','Verified closed'):f.state==='reopened'?chip('crit','Reopened: still present'):chip('med','Fix reported, not verified');
    return '<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)"><div><div>'+esc(f.title)+'</div><div style="margin-top:6px">'+st+'</div></div>'+(f.state==='fix_reported'||f.state==='reopened'?'<button class="btn sm" data-verify="'+f.id+'"'+(S.role==='board'?' disabled':'')+'>Run verification scan</button>':'')+'</div>';
  }).join('')+'<p class="note" style="margin-top:12px">In this sample the first fix passes its re-scan and the second fails, so you can see both paths. Failed checks stay open and count against the owner’s SLA.</p></div>'+
  '<div class="card"><h3>Risk-acceptance register</h3>'+
  (S.accept.length?S.accept.map(function(a){var d=daysTo(a.expires);return '<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+esc(a.title)+'</b>'+(d<=0?chip('crit','Expired'):d<=30?chip('med','Expires in '+d+' days'):chip('mute','Expires in '+d+' days'))+'</div><div class="note" style="margin-top:4px">'+esc(a.reason)+'</div><div class="note mono" style="margin-top:4px">Approver '+esc(a.approver)+' · expires '+esc(a.expires)+'</div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm" data-renew="'+a.id+'"'+(dis?' disabled':'')+'>Renew 90 days</button><button class="btn sm" data-revoke="'+a.id+'"'+(dis?' disabled':'')+'>Revoke and reopen</button></div></div>'}).join(''):'<p class="note">No accepted risks.</p>')+
  '<p class="note" style="margin-top:12px">Accepted risks still count in the score. Use the decision queue to add one.</p></div></div>';
}

/* 7 changed */
function rChanged(){
  var cur=BASE, old=compute(D.map(function(d){return Object.assign({},d,{raw:d.tr[BOARD_IDX]})}));
  var rows=D.map(function(d,i){var o=old.rows[i],n=cur.rows[i];return {d:d,o:o.adj,n:n.adj,ob:o.band,nb:n.band,dl:n.adj-o.adj}}).sort(function(a,b){return Math.abs(b.dl)-Math.abs(a.dl)});
  $('v-changed').innerHTML=
  '<div class="answer"><span class="q">What moved since the last board meeting?</span><h1>Headline '+(old.disp===cur.disp?'unchanged at '+cur.disp:'moved from '+old.disp+' to '+cur.disp)+'; '+rows.filter(function(r){return r.dl>=1}).length+' domains worsened, '+rows.filter(function(r){return r.dl<=-1}).length+' improved.</h1><p>Compared with the '+MONTHS[BOARD_IDX]+' snapshot (illustrative history). Methodology and policy are the same in both columns, so the difference is real change, not a model change.</p></div>'+
  '<div class="grid g2"><div class="card"><h3>Biggest movers</h3><div class="diff">'+
  rows.slice(0,8).map(function(r){var cls=r.dl>=1?'arrow-up':r.dl<=-1?'arrow-dn':'arrow-eq';var sym=r.dl>=1?'▲':r.dl<=-1?'▼':'▬';
    return '<div class="row"><span>'+esc(r.d.n)+'</span><span class="mono muted">'+f1(r.o)+'</span><span class="mono">→ '+f1(r.n)+'</span><span class="mono '+cls+'">'+sym+' '+(r.dl>0?'+':'')+f1(r.dl)+'</span></div>'}).join('')+'</div></div>'+
  '<div class="card"><h3>Also changed</h3><div class="kv">'+
   '<span>Arithmetic score</span><span>'+f1(old.arith)+' → '+f1(cur.arith)+'</span>'+
   '<span>Critical domains</span><span>'+old.counts.Critical+' → '+cur.counts.Critical+'</span>'+
   '<span>High domains</span><span>'+old.counts.High+' → '+cur.counts.High+'</span>'+
   '<span>Decisions taken this session</span><span>'+S.decisions.length+'</span>'+
   '<span>Mean time to remediate (illustrative)</span><span>41 → 36 days</span>'+
   '<span>SLA breaches (illustrative)</span><span>9 → 7</span></div>'+
   '<p class="note" style="margin-top:12px">Trend colours are paired with arrows and signs so the meaning survives print and colour-blind use.</p></div></div>';
}

/* 8 pack */
function rPack(){
  var B=BASE, old=compute(D.map(function(d){return Object.assign({},d,{raw:d.tr[BOARD_IDX]})}));
  var movers=D.map(function(d,i){return {n:d.n,dl:B.rows[i].adj-old.rows[i].adj}}).sort(function(a,b){return Math.abs(b.dl)-Math.abs(a.dl)}).slice(0,3);
  var crit=B.rows.filter(function(r){return r.band==='Critical'});
  var open=S.queue.filter(function(q){return q.state==='open'});
  var exp=S.accept.filter(function(a){return daysTo(a.expires)<=30});
  $('v-pack').innerHTML=
  '<div class="answer noprint"><span class="q">What do I send the board?</span><h1>A draft pack, built from the changes and ready for your review.</h1><p>Every sentence below comes from a data row and carries its source. The pack is assembled from a fixed template; a named person reviews and approves it before it is shared.</p></div>'+
  '<div class="noprint" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><button class="btn primary sm" id="pk-print">Export to PDF / print</button><button class="btn sm" id="pk-approve"'+(canAct()?'':' disabled')+'>Mark reviewed</button></div>'+
  '<article class="pack"><div class="meta">DWAN Executive Cyber Risk Command Center · Board pack · Al Dhabi Holdings · snapshot 5 Sep 2026 · DRAFT (sample data)</div>'+
  '<h2>Cyber risk is '+esc(B.disp)+', driven by '+crit.length+' Critical domain'+(crit.length===1?'':'s')+'</h2>'+
  '<p>The weighted, coverage-adjusted score is '+f1(B.arith)+' ('+esc(band(B.arith))+'); the floor rule raises the headline to '+esc(B.disp)+' because '+esc(crit.map(function(r){return r.d.n}).join(' and '))+' '+(crit.length>1?'are':'is')+' Critical. Spread: '+B.counts.Critical+' Critical, '+B.counts.High+' High, '+B.counts.Medium+' Medium, '+B.counts.Low+' Low.<span class="src">[enterprise_scores_v2]</span></p>'+
  '<h4>Money</h4><p>Modelled annualised loss exposure is AED '+f1(ENT.ale)+'M expected, and about AED '+f1(ENT.p90)+'M in a bad year (1 in 10). The largest driver is '+esc(LOSS.ran.name.toLowerCase())+' at AED '+f2(LOSS.ran.ale)+'M expected.<span class="src">[loss_models]</span></p>'+
  '<h4>What changed since the '+MONTHS[BOARD_IDX]+' meeting</h4><ul>'+movers.map(function(m){return '<li>'+esc(m.n)+' '+(m.dl>=1?'worsened':m.dl<=-1?'improved':'was broadly flat')+' ('+(m.dl>0?'+':'')+f1(m.dl)+' points).<span class="src">[domain_scores_v2]</span></li>'}).join('')+'</ul>'+
  '<h4>Decisions needed</h4>'+(open.length?'<ul>'+open.map(function(q){return '<li>'+esc(q.title)+'. Recommended: '+esc(q.rec.charAt(0).toLowerCase()+q.rec.slice(1))+'<span class="src">[risk_findings]</span></li>'}).join('')+'</ul>':'<p>No open decisions.</p>')+
  (S.decisions.length?'<h4>Decisions taken</h4><ul>'+S.decisions.map(function(x){return '<li>'+esc(x)+'<span class="src">[executive_decisions]</span></li>'}).join('')+'</ul>':'')+
  '<h4>Appetite and accepted risks</h4><p>'+B.rows.filter(function(r){return r.adj>r.d.app}).length+' of 12 domains are outside the board’s appetite. '+(exp.length?exp.length+' accepted risk'+(exp.length>1?'s expire':' expires')+' within 30 days and need a renewal decision: '+esc(exp.map(function(a){return a.title}).join('; '))+'.':'No accepted risks expire within 30 days.')+'<span class="src">[risk_appetite, risk_acceptances]</span></p>'+
  '<h4>Confidence</h4><p>Overall confidence is '+confLbl(B.conf).toLowerCase()+' ('+Math.round(B.conf*100)+'%). Lowest-confidence domains: '+esc(B.rows.slice().sort(function(a,b){return a.conf-b.conf}).slice(0,3).map(function(r){return r.d.n+' ('+Math.round(r.conf*100)+'%)'}).join(', '))+'.<span class="src">[ingestion_runs, asset_coverage]</span></p>'+
  '</article>';
  $('pk-print').onclick=function(){window.print()};
  var ap=$('pk-approve');if(ap)ap.onclick=function(){toast('Pack marked reviewed by '+roleName()+' (logged to the audit trail).')};
}
function roleName(){return {board:'Board member',cxo:'CXO',ciso:'CISO',risk:'Risk lead',analyst:'Analyst'}[S.role]}

/* drawer */
function openDrawer(id){
  var r=BASE.rows.filter(function(x){return x.d.id===id})[0],d=r.d;
  var contrib=r.adj*d.w/D.reduce(function(a,x){return a+x.w},0);
  var h='<button class="btn sm x" id="dx" aria-label="Close">Close</button><div class="lbl">Evidence</div><h2>'+esc(d.n)+'</h2><div style="margin:8px 0 16px">'+bandChip(r.band)+' '+chip(appCls(appState(r.adj,d.app)).replace('c-',''),appState(r.adj,d.app))+'</div>'+
  '<div class="kv"><span>Raw score</span><span>'+r.raw+'</span><span>Coverage</span><span>'+Math.round(d.cov*100)+'%</span><span>Unobserved assets assumed at</span><span>'+Math.max(r.raw,U)+'</span><span>Adjusted score</span><span>'+f1(r.adj)+'</span><span>Business weight</span><span>'+d.w+'</span><span>Contribution to composite</span><span>'+f1(contrib)+' pts</span><span>Confidence</span><span>'+Math.round(r.conf*100)+'%</span><span>Feeds fresh</span><span>'+d.fresh+' of '+d.tot+'</span><span>Appetite limit</span><span>'+d.app+'</span></div>'+
  '<div class="rule"></div><div class="lbl" style="margin-bottom:8px">Trend, '+MONTHS[0]+' to '+MONTHS[5]+' (raw)</div>'+spark(d.tr,'var(--accent)',380,60)+'<div class="note mono" style="display:flex;justify-content:space-between">'+MONTHS.map(function(m,i){return '<span>'+m+' '+d.tr[i]+'</span>'}).join('')+'</div>';
  if(id==='ran'){
    h+='<div class="rule"></div><div class="lbl" style="margin-bottom:8px">Score build (from the deck)</div><table><thead><tr><th>Category</th><th class="num">Weight</th><th class="num">Gap</th><th class="num">Points</th></tr></thead><tbody>'+RAN_CATS.map(function(c){return '<tr><td>'+esc(c.n)+'</td><td class="num">'+c.w+'</td><td class="num">'+c.gap+'%</td><td class="num">'+f1(c.w*c.gap/100)+'</td></tr>'}).join('')+'<tr><td><b>Domain score</b></td><td class="num">100</td><td></td><td class="num"><b>54.0</b></td></tr></tbody></table><p class="note" style="margin-top:8px">Largest driver: only 7 of 28 recovery tests met target.</p>';
  } else {
    h+='<div class="rule"></div><p class="note">In production this drawer lists each tool category, its numerator and denominator, the connector run, and a link to the raw payload, so any score traces back to the tool data.</p>';
  }
  $('drawer').innerHTML=h;$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false');$('scrim').hidden=false;
  $('dx').onclick=closeDrawer;$('dx').focus();
}
function closeDrawer(){$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');$('scrim').hidden=true}
$('scrim').onclick=closeDrawer;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-v],[data-open],[data-evid],[data-approve],[data-accept],[data-defer],[data-undo],[data-confirm-accept],[data-cancel-accept],[data-preset],[data-savescen],[data-todec],[data-verify],[data-renew],[data-revoke]');
  if(!t)return;
  var q;
  if(t.dataset.v){show(t.dataset.v);return}
  if(t.dataset.open||t.dataset.evid){openDrawer(t.dataset.open||t.dataset.evid);return}
  if(t.dataset.approve){q=find(t.dataset.approve);q.state='approved';S.decisions.push('Approved: '+q.title+' ('+roleName()+')');S.fixes.unshift({id:'f'+Date.now(),title:q.title.length>60?q.title.slice(0,58)+'…':q.title,state:'fix_reported',attempts:0,willPass:true});toast('Approved. A fix is tracked in Closure and acceptance.');rerender();return}
  if(t.dataset.defer){q=find(t.dataset.defer);q.state='deferred';S.decisions.push('Deferred: '+q.title);rerender();return}
  if(t.dataset.undo){q=find(t.dataset.undo);q.state='open';rerender();return}
  if(t.dataset.accept){S.openForm=t.dataset.accept;rerender();return}
  if('cancelAccept' in t.dataset){S.openForm=null;rerender();return}
  if(t.dataset.confirmAccept){
    var reason=$('af-reason').value.trim();if(!reason){$('af-reason').focus();toast('A reason is required to accept a risk.');return}
    q=find(t.dataset.confirmAccept);var days=parseInt($('af-exp').value,10),ap=$('af-appr').value;
    q.state='accepted';q.until=daysFromNow(days);S.accept.push({id:'a'+Date.now(),title:q.title,reason:reason,approver:ap,expires:q.until});
    S.decisions.push('Accepted until '+q.until+' (approver '+ap+'): '+q.title);S.openForm=null;toast('Risk accepted with expiry. Added to the register.');rerender();return}
  if(t.dataset.preset){S.whatif=Object.assign({cost:S.whatif.cost},PRESETS[t.dataset.preset]);S.whatif._p=t.dataset.preset;rerender();return}
  if('savescen' in t.dataset){var raw=ransomRaw(S.whatif),ov={ran:raw},af=compute(D,ov),rr=af.rows.filter(function(r){return r.d.id==='ran'})[0],bb=BASE.rows.filter(function(r){return r.d.id==='ran'})[0];
    var red=LOSS.ran.ale*(1-rr.adj/bb.adj);var nm=S.whatif._p&&PNAME[S.whatif._p]?PNAME[S.whatif._p]:'Custom scenario';
    S.scen.push({name:nm,score:f1(raw),red:f2(red),cost:S.whatif.cost});toast('Scenario saved.');rerender();return}
  if(t.dataset.todec){var s=S.scen[+t.dataset.todec];S.decisions.push('Funding decision from scenario "'+s.name+'" (ransomware score '+s.score+', AED '+s.red+'M expected loss avoided a year; '+roleName()+')');toast('Converted to a decision and logged.');return}
  if(t.dataset.verify){var f=S.fixes.filter(function(x){return x.id===t.dataset.verify})[0];f.attempts++;f.state=f.willPass?'verified_closed':'reopened';S.decisions.push((f.willPass?'Verified closed by re-scan: ':'Re-scan found weakness still present: ')+f.title);toast(f.willPass?'Re-scan confirms the weakness is gone. Finding closed.':'Re-scan still finds the weakness. Finding stays open.');rerender();return}
  if(t.dataset.renew){var a=S.accept.filter(function(x){return x.id===t.dataset.renew})[0];a.expires=daysFromNow(daysTo(a.expires)+90);toast('Renewed for 90 days.');rerender();return}
  if(t.dataset.revoke){S.accept=S.accept.filter(function(x){return x.id!==t.dataset.revoke});toast('Acceptance revoked. The finding is open again.');rerender();return}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-open]')){e.preventDefault();openDrawer(e.target.dataset.open)}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.wi){S.whatif[t.dataset.wi]=+t.value;S.whatif._p=null;rWhatif();var el=$('wi-'+t.dataset.wi);if(el){el.focus()}}
  if(t.id==='wi-cost'){S.whatif.cost=t.value;rWhatif();var c=$('wi-cost');c.focus();try{c.setSelectionRange(c.value.length,c.value.length)}catch(x){}}
});
$('role').addEventListener('change',function(){S.role=this.value;show(LANDING[S.role])});
function find(id){return S.queue.filter(function(q){return q.id===id})[0]}

show(LANDING[S.role]);
})();
</script>
